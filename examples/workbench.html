<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VessertID — Master Application Workbench</title>
  <link rel="stylesheet" href="./example.css" />
  <style>
    /* ==========================================================================
       Master Workbench Layout - Expansive & Fully Integrated
       ========================================================================== */
    .wb-viewport {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      display: flex;
      overflow: hidden;
    }

    /* Expansive Console Canvas: Always 100% full width & full height */
    .wb-canvas {
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #app-container {
      width: 100%;
      height: 100%;
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* Studio Controls Pill Button */
    .wb-studio-pill {
      background: #141f30;
      border: 1px solid #233550;
      color: #38bdf8;
      font-size: 11.5px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .wb-studio-pill:hover {
      background: #1e2e47;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulseAnim 2s infinite ease-in-out;
    }
    @keyframes pulseAnim {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }
    .pill-theme-badge {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #7dd3fc;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Studio Backdrop Overlay */
    .wb-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(4, 7, 13, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .wb-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Integrated Sliding Studio Drawer */
    .wb-drawer {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(390px, 92vw);
      max-width: 100%;
      height: 100%;
      background: #0d131f;
      border-left: 1px solid #1e2a40;
      box-shadow: -12px 0 40px rgba(0, 0, 0, 0.7);
      z-index: 1001;
      display: flex;
      flex-direction: column;
      transform: translateX(105%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .wb-drawer.open {
      transform: translateX(0);
    }

    /* Drawer Header */
    .wb-drawer-header {
      height: 48px;
      min-height: 48px;
      padding: 0 16px;
      background: #111a2b;
      border-bottom: 1px solid #1e2b42;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .wb-drawer-title {
      font-size: 12.5px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .wb-drawer-close {
      background: transparent;
      border: 1px solid #28364f;
      color: #94a3b8;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.15s ease;
    }
    .wb-drawer-close:hover {
      background: #ef4444;
      border-color: #ef4444;
      color: #fff;
    }

    /* Drawer Scrollable Content */
    .wb-drawer-body {
      flex: 1 1 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .wb-drawer-body::-webkit-scrollbar {
      width: 5px;
    }
    .wb-drawer-body::-webkit-scrollbar-thumb {
      background: #25334c;
      border-radius: 4px;
    }

    /* Studio Card Section */
    .wb-card {
      background: #121a28;
      border: 1px solid #1c273b;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .wb-card-title {
      font-size: 11px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Grid of Theme Buttons */
    .wb-theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .wb-theme-btn {
      background: #172132;
      border: 1px solid #233148;
      color: #cbd5e1;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s ease;
    }
    .wb-theme-btn:hover {
      background: #202e45;
      color: #fff;
      border-color: #38bdf8;
    }
    .wb-theme-btn.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
      font-weight: 600;
    }
    .theme-color-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Toggle Items */
    .wb-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #162030;
      border: 1px solid #202d42;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: #cbd5e1;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .wb-toggle-row:hover {
      border-color: #38bdf8;
      color: #fff;
    }
    .wb-toggle-row input[type="checkbox"] {
      accent-color: #38bdf8;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Generator Action Grid */
    .wb-action-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .wb-action-btn {
      background: #172132;
      border: 1px solid #233148;
      color: #cbd5e1;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .wb-action-btn:hover {
      background: #213047;
      color: #fff;
      border-color: #38bdf8;
    }

    /* Header Mobile Adjustments */
    .example-header {
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .example-header::-webkit-scrollbar {
      display: none;
    }

    @media (max-width: 640px) {
      .wb-header-sub {
        display: none !important;
      }
      .example-actions button span {
        display: none;
      }
    }
  </style>
</head>
<body class="example">
  <!-- Top Navigation Header -->
  <header class="example-header">
    <a href="./index.html">← Gallery</a>
    <h1 style="font-size: 13px;">Master Workbench</h1>
    <span class="wb-header-sub" style="font-size: 11px; color: #64748b;">Unified VessertApp</span>

    <!-- Master Studio Pill Trigger -->
    <button id="btn-open-studio" class="wb-studio-pill" title="Open Studio Controls & Presets">
      <span class="pulse-dot"></span>
      <span>🎛️ Studio Controls</span>
      <span class="pill-theme-badge" id="pill-theme-name">DARK</span>
    </button>

    <!-- Quick Actions -->
    <div class="example-actions">
      <button id="btn-burst" title="Burst 20 Log Events">🚀 <span>Burst</span></button>
      <button id="btn-bench" title="Run 1,000 Records Benchmark">⚡ <span>Bench</span></button>
      <button id="btn-export" title="Export Buffer as JSON">💾 <span>Export</span></button>
      <button id="btn-clear" title="Clear Console Screen">🧹 <span>Clear</span></button>
    </div>
  </header>

  <!-- Main Viewport -->
  <div class="example-body">
    <div class="wb-viewport">
      <!-- Expansive 100% Canvas for VessertApp -->
      <div class="wb-canvas">
        <div id="app-container"></div>
      </div>

      <!-- Backdrop for Drawer on any screen -->
      <div class="wb-backdrop" id="studio-backdrop"></div>

      <!-- Integrated Sliding Studio Drawer -->
      <aside class="wb-drawer" id="studio-drawer">
        <!-- Drawer Header -->
        <div class="wb-drawer-header">
          <div class="wb-drawer-title">
            <span>🎛️</span>
            <span>Studio Control Center</span>
          </div>
          <button class="wb-drawer-close" id="btn-close-studio" title="Close Panel">✕</button>
        </div>

        <!-- Drawer Content -->
        <div class="wb-drawer-body">
          <!-- Active Status Banner -->
          <div class="wb-card" style="background: #0f1826; border-color: #243550;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 11px; font-family: 'JetBrains Mono', monospace; color: #94a3b8;">SYSTEM ENGINE:</span>
              <span style="font-size: 11px; font-family: 'JetBrains Mono', monospace; color: #22c55e; font-weight: 700;">● VESSERT ONLINE</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-family: 'JetBrains Mono', monospace; color: #64748b;">
              <span>ORCHESTRATOR:</span>
              <span style="color: #38bdf8;">VessertApp (Integrated)</span>
            </div>
          </div>

          <!-- Theme Palette Selection -->
          <div class="wb-card">
            <div class="wb-card-title">
              <span>🎨 Visual Theme</span>
              <span style="font-size: 10px; color: #94a3b8;" id="theme-count">7 Themes</span>
            </div>
            <div class="wb-theme-grid" id="theme-grid">
              <button class="wb-theme-btn active" data-theme="dark">
                <span class="theme-color-dot" style="background: #38bdf8;"></span>
                <span>Dark</span>
              </button>
              <button class="wb-theme-btn" data-theme="dracula">
                <span class="theme-color-dot" style="background: #bd93f9;"></span>
                <span>Dracula</span>
              </button>
              <button class="wb-theme-btn" data-theme="nord">
                <span class="theme-color-dot" style="background: #88c0d0;"></span>
                <span>Nord</span>
              </button>
              <button class="wb-theme-btn" data-theme="monokai">
                <span class="theme-color-dot" style="background: #a6e22e;"></span>
                <span>Monokai</span>
              </button>
              <button class="wb-theme-btn" data-theme="gruvbox">
                <span class="theme-color-dot" style="background: #fe8019;"></span>
                <span>Gruvbox</span>
              </button>
              <button class="wb-theme-btn" data-theme="solarized-dark">
                <span class="theme-color-dot" style="background: #268bd2;"></span>
                <span>Solarized</span>
              </button>
              <button class="wb-theme-btn" data-theme="light">
                <span class="theme-color-dot" style="background: #e2e8f0; border: 1px solid #94a3b8;"></span>
                <span>Light</span>
              </button>
            </div>
          </div>

          <!-- Addons & Effects -->
          <div class="wb-card">
            <div class="wb-card-title">
              <span>✨ Addons & Effects</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <label class="wb-toggle-row">
                <span>Retro CRT Scanlines</span>
                <input type="checkbox" id="chk-crt" />
              </label>
              <label class="wb-toggle-row">
                <span>Typewriter Animation</span>
                <input type="checkbox" id="chk-typewriter" />
              </label>
              <label class="wb-toggle-row">
                <span>Developer Inspector</span>
                <input type="checkbox" id="chk-inspector" />
              </label>
              <label class="wb-toggle-row">
                <span>Bloom Phosphor Glow</span>
                <input type="checkbox" id="chk-bloom" />
              </label>
            </div>
          </div>

          <!-- Runtime Presets -->
          <div class="wb-card">
            <div class="wb-card-title">
              <span>📦 Environment Presets</span>
            </div>
            <div class="wb-action-grid" id="preset-grid">
              <button class="wb-action-btn" data-preset="node">🟢 Node.js</button>
              <button class="wb-action-btn" data-preset="bun">🥟 Bun</button>
              <button class="wb-action-btn" data-preset="chrome">🌐 Chrome</button>
              <button class="wb-action-btn" data-preset="vscode">💻 VS Code</button>
            </div>
          </div>

          <!-- Live Event Generator -->
          <div class="wb-card">
            <div class="wb-card-title">
              <span>🧪 Event Generator</span>
            </div>
            <div class="wb-action-grid">
              <button class="wb-action-btn" id="gen-info" style="color: #38bdf8;">ℹ Info Event</button>
              <button class="wb-action-btn" id="gen-warn" style="color: #fbbf24;">⚠ Warn Notice</button>
              <button class="wb-action-btn" id="gen-error" style="color: #f87171;">✖ Error Trace</button>
              <button class="wb-action-btn" id="gen-debug" style="color: #c084fc;">🐞 Debug Dump</button>
            </div>
          </div>

          <!-- Diagnostics -->
          <div class="wb-card">
            <div class="wb-card-title">
              <span>⚡ Performance & Tools</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <button class="wb-action-btn" id="btn-drawer-bench" style="justify-content: center;">⚡ Run 1,000 Log Benchmark</button>
              <button class="wb-action-btn" id="btn-drawer-export" style="justify-content: center;">💾 Export JSON Log Archive</button>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Integrated VessertApp Logic -->
  <script type="module">
    import { VessertApp } from "./jsm/app/VessertApp.js";

    // 1. Initialize the Unified VessertApp Prototype
    const app = new VessertApp({
      container: document.getElementById("app-container"),
      title: "Master Console Workstation",
      badge: "VESSERT-APP",
      theme: "dark",
      persist: true
    });

    // Initial Welcome Message
    app.info("🚀 VessertID Master Workbench Initialized");
    app.log("Core Engine (src/) + Visual UI (jsm/ui/) + Modular Addons (jsm/) seamlessly connected.");
    app.debug("Tap [🎛️ Studio Controls] above to switch themes, toggle addons, or test presets.");

    // Sync pill theme badge
    const updateThemeBadge = (name) => {
      const el = document.getElementById("pill-theme-name");
      if (el) el.textContent = name.toUpperCase();
    };

    // 2. Studio Drawer Open / Close Logic
    const drawer = document.getElementById("studio-drawer");
    const backdrop = document.getElementById("studio-backdrop");
    const btnOpen = document.getElementById("btn-open-studio");
    const btnClose = document.getElementById("btn-close-studio");

    const openDrawer = () => {
      drawer.classList.add("open");
      backdrop.classList.add("open");
    };

    const closeDrawer = () => {
      drawer.classList.remove("open");
      backdrop.classList.remove("open");
    };

    btnOpen?.addEventListener("click", openDrawer);
    btnClose?.addEventListener("click", closeDrawer);
    backdrop?.addEventListener("click", closeDrawer);

    // Escape key closes drawer
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && drawer.classList.contains("open")) {
        closeDrawer();
      }
    });

    // 3. Theme Switcher
    document.querySelectorAll("#theme-grid .wb-theme-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#theme-grid .wb-theme-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const theme = btn.dataset.theme;
        app.setTheme(theme);
        updateThemeBadge(theme);
      });
    });

    // 4. Addons & Effects
    document.getElementById("chk-crt")?.addEventListener("change", (e) => {
      app.toggleCRT(e.target.checked);
      if (e.target.checked) app.info("CRT Phosphor scanline filter active.");
    });

    document.getElementById("chk-typewriter")?.addEventListener("change", (e) => {
      if (e.target.checked) {
        app.activatePlugin("typewriter");
        const tw = app.activePlugins.get("typewriter");
        tw?.type("Typewriter animation plugin successfully engaged via VessertApp.", 35);
      }
    });

    document.getElementById("chk-inspector")?.addEventListener("change", (e) => {
      if (e.target.checked) {
        app.activatePlugin("inspector");
        app.info("Inspector debugging panel attached to workbench.");
      }
    });

    document.getElementById("chk-bloom")?.addEventListener("change", (e) => {
      if (e.target.checked) {
        app.activatePlugin("bloom");
        app.info("High-intensity bloom glow layer applied.");
      }
    });

    // 5. Presets
    document.querySelectorAll("#preset-grid .wb-action-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const p = btn.dataset.preset;
        app.info(`Environment preset [${p.toUpperCase()}] profile active.`);
      });
    });

    // 6. Live Event Emitter
    document.getElementById("gen-info")?.addEventListener("click", () => {
      app.info("Service discovery initialized [cluster: asia-southeast1]");
    });
    document.getElementById("gen-warn")?.addEventListener("click", () => {
      app.warn("Disk buffer latency 142ms exceeded target threshold 80ms");
    });
    document.getElementById("gen-error")?.addEventListener("click", () => {
      app.error("ConnectionRefused: 127.0.0.1:5432 - Database pool unreachable");
    });
    document.getElementById("gen-debug")?.addEventListener("click", () => {
      app.debug("Frame heap allocation: { used: '34.2MB', limit: '128MB', gc: 2 }");
    });

    // 7. Actions & Benchmarks
    const runBurst = () => {
      for (let i = 1; i <= 20; i++) {
        const types = ["log", "info", "warn", "debug"];
        const t = types[i % types.length];
        app[t](`Event Packet #${i}: Verification token signed at ${new Date().toLocaleTimeString()}`);
      }
    };

    const runBench = () => {
      const start = performance.now();
      for (let i = 1; i <= 1000; i++) {
        app.log(`Bench record ${i} - timestamp: ${Date.now()}`);
      }
      const duration = (performance.now() - start).toFixed(2);
      app.info(`⚡ Benchmark complete: 1,000 log records rendered in ${duration}ms!`);
    };

    const runExport = () => {
      const json = app.export("json");
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "vessert-workbench-export.json";
      a.click();
      URL.revokeObjectURL(url);
    };

    document.getElementById("btn-burst")?.addEventListener("click", runBurst);
    document.getElementById("btn-bench")?.addEventListener("click", runBench);
    document.getElementById("btn-drawer-bench")?.addEventListener("click", () => {
      runBench();
      closeDrawer();
    });
    document.getElementById("btn-export")?.addEventListener("click", runExport);
    document.getElementById("btn-drawer-export")?.addEventListener("click", runExport);
    document.getElementById("btn-clear")?.addEventListener("click", () => app.clear());
  </script>
</body>
</html>
