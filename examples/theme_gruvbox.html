<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VessertID — Theme: Gruvbox</title>
  <link rel="stylesheet" href="./example.css" />
</head>
<body class="example">
  <div class="example-header">
    <a href="./index.html">← Back to Examples</a>
    <h1>Theme: Gruvbox</h1>
    <span style="font-size:12px;color:#8b949e;">Gruvbox theme</span>
    <div class="example-actions">
      <button id="btn-log">Log</button>
      <button id="btn-warn">Warn</button>
      <button id="btn-error">Error</button>
      <button id="btn-clear">Clear</button>
    </div>
  </div>
  <div class="example-body" id="console-container"></div>

  <script type="module">
    import { Console } from "../src/Vessert.js";
    import { ConsoleUI } from "./jsm/ui/ConsoleUI.js";
    const c = new Console({ theme: "gruvbox" });
    const container = document.getElementById("console-container");
    const ui = new ConsoleUI(c, {
      container,
      title: "Theme: Gruvbox",
      theme: "gruvbox",
      retroCRT: false,
      badge: "THEME"
    });
    c.log("VessertID Console: Theme: Gruvbox");
    c.info("Gruvbox theme");
    c.debug("Module initialized. Revision: 1.0.0");
    document.getElementById("btn-log")?.addEventListener("click", () => c.log("Sample log at " + new Date().toLocaleTimeString()));
    document.getElementById("btn-warn")?.addEventListener("click", () => c.warn("Sample warning message"));
    document.getElementById("btn-error")?.addEventListener("click", () => c.error("Sample error message"));
    document.getElementById("btn-clear")?.addEventListener("click", () => c.clear());
  </script>
</body>
</html>
