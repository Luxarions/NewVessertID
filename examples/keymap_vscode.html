<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VessertID — Keymap: VS Code</title>
  <link rel="stylesheet" href="./example.css" />
</head>
<body class="example">
  <div class="example-header">
    <a href="./index.html">← Back to Examples</a>
    <h1>Keymap: VS Code</h1>
    <span style="font-size:12px;color:#8b949e;">VS Code shortcuts</span>
    <div class="example-actions">
      <button id="btn-log">Log</button>
      <button id="btn-warn">Warn</button>
      <button id="btn-error">Error</button>
      <button id="btn-clear">Clear</button>
    </div>
  </div>
  <div class="example-body" id="console-container"></div>

  <script type="module">
    import { VessertApp } from "./jsm/app/VessertApp.js";
    const app = new VessertApp({
      container: document.getElementById("console-container"),
      title: "Keymap: VS Code",
      theme: "dark",
      retroCRT: false,
      badge: "KEYMAP",
      plugins: []
    });
    const c = app; // Aliased for full backward compatibility
    c.log("VessertID Console: Keymap: VS Code");
    c.info("VS Code shortcuts");
    c.debug("Module initialized. Revision: 1.0.0");
    document.getElementById("btn-log")?.addEventListener("click", () => c.log("Sample log at " + new Date().toLocaleTimeString()));
    document.getElementById("btn-warn")?.addEventListener("click", () => c.warn("Sample warning message"));
    document.getElementById("btn-error")?.addEventListener("click", () => c.error("Sample error message"));
    document.getElementById("btn-clear")?.addEventListener("click", () => c.clear());
  </script>
</body>
</html>
